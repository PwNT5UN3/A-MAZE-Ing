[build-system]
requires = ["setuptools>=61", "numpy>=1.21", "wheel>=0.36"]
build-backend = "setuptools.build_meta"

[project]
version = "0.0.0"
requires-python = ">=3.10"
dependencies = ["termcolor>=1.1.0", "readchar>=3.0.0"]

[tool.setuptools]
package-dir = { "" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
